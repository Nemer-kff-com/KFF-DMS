<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-reports</title>
<link rel="stylesheet" href="_base.css">
<style>
body{display:flex;align-items:center;justify-content:center}
.wrap{width:1000px;padding:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{background:#f8f6f2;border:1px solid #e6e2da;border-radius:12px;padding:14px;text-align:center}
.stat .v{font-size:26px;font-weight:700}
.stat .l{font-size:13px;color:#6b7280;margin-top:4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.filters .f{min-width:140px;flex:1}
</style>
</head>
<body>
  <div class="card wrap">
    <div class="h">التقارير</div>
    <div class="sub">فلترة ← عرض ← طباعة أو تصدير Excel</div>
    <div class="filters">
      <div class="f"><label>النوع</label><input value="الكل" readonly></div>
      <div class="f"><label>القسم</label><input value="جميع الأقسام" readonly></div>
      <div class="f"><label>من</label><input value="2026-09-01" readonly></div>
      <div class="f"><label>إلى</label><input value="2026-09-08" readonly></div>
      <button class="btn" type="button">عرض</button>
      <button class="btn2" type="button">طباعة</button>
      <button class="btn3" type="button">تصدير Excel</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="v">42</div><div class="l">وارد</div></div>
      <div class="stat"><div class="v">35</div><div class="l">صادر</div></div>
      <div class="stat"><div class="v">77</div><div class="l">الإجمالي</div></div>
      <div class="stat"><div class="v">4</div><div class="l">متأخر</div></div>
    </div>
    <table>
      <thead><tr><th>الرقم</th><th>النوع</th><th>الموضوع</th><th>الحالة</th></tr></thead>
      <tbody>
        <tr><td>و/2026/000210</td><td>وارد</td><td>طلب تعاون</td><td>قيد الإجراء</td></tr>
        <tr><td>ص/2026/000150</td><td>صادر</td><td>دعوة اجتماع</td><td>تم التسليم</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
