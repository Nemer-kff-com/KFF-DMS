<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-entities</title>
<link rel="stylesheet" href="_base.css">
<style>
body{display:flex;align-items:center;justify-content:center}
.wrap{width:860px;padding:28px}
.prev{background:#f8f6f2;border:1px dashed #e6e2da;border-radius:10px;padding:12px;margin-top:8px;font-size:14px}
</style>
</head>
<body>
  <div class="card wrap">
    <div class="h">جهة مراسلة جديدة</div>
    <div class="sub">جهات قسمك قابلة للتعديل — العامة للعرض عادة</div>
    <div class="row">
      <div><label>الاسم عربي *</label><input value="مؤسسة …" readonly></div>
      <div><label>اللقب / التكريم</label><input value="سعادة / الأستاذ" readonly></div>
    </div>
    <div class="row">
      <div><label>الجوال (واتساب)</label><input value="05xxxxxxxx" readonly></div>
      <div><label>البريد</label><input value="info@example.com" readonly></div>
    </div>
    <div class="prev"><strong>معاينة «موجهة إلى»:</strong> سعادة / الأستاذ …</div>
    <div class="actions"><button class="btn" type="button">حفظ</button><button class="btn2" type="button">إلغاء</button></div>
  </div>
</body>
</html>
