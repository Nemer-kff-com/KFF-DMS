<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-verify</title>
<link rel="stylesheet" href="_base.css">
<style>
body{display:flex;align-items:center;justify-content:center}
.wrap{width:520px;padding:32px;text-align:center}
.ok{display:inline-block;background:#e8f5e9;color:#1b5e20;font-weight:700;padding:8px 16px;border-radius:999px;margin:12px 0}
.box{text-align:right;margin-top:18px;background:#f8f6f2;border-radius:12px;padding:16px}
.row2{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.lang{position:absolute;top:18px;left:24px;display:flex;gap:6px}
.lang span{border:1px solid #e6e2da;border-radius:6px;padding:4px 10px;font-weight:700;font-size:13px;background:#fff}
.lang .on{background:#3B4F6E;color:#fff;border-color:#3B4F6E}
body{position:relative}
</style>
</head>
<body>
  <div class="lang"><span class="on">ع</span><span>EN</span></div>
  <div class="card wrap">
    <img src="logo.png" alt="" style="width:90px;margin:0 auto 10px;display:block">
    <div class="h" style="text-align:center">التحقق من المعاملة</div>
    <div class="ok">✓ معاملة موثّقة</div>
    <div class="box">
      <div class="row2"><span>الرقم</span><strong>ص/2026/000150</strong></div>
      <div class="row2"><span>النوع</span><strong>صادر</strong></div>
      <div class="row2"><span>الموضوع</span><strong>دعوة اجتماع</strong></div>
    </div>
    <div class="hint" style="margin-top:14px;text-align:center">صفحة عامة — بدون تسجيل دخول · لا تعرض المرفقات السرية</div>
  </div>
</body>
</html>
