<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-brief</title>
<link rel="stylesheet" href="_base.css">
<style>
body{display:flex;align-items:center;justify-content:center}
.wrap{width:900px;padding:26px}
.status{display:inline-block;background:#eef1f5;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
  <div class="card wrap">
    <div class="h">ورقة العرض</div>
    <div class="sub">للوارد فقط — و/2026/000210</div>
    <span class="status">مسودة عرض</span>
    <div class="row">
      <div><label>أساس المعاملة</label><textarea rows="2" readonly>طلب تعاون وارد من الجهة…</textarea></div>
      <div><label>الدراسة</label><textarea rows="2" readonly>بعد المراجعة يُقترح الموافقة…</textarea></div>
    </div>
    <div class="row">
      <div><label>التوصية</label><textarea rows="2" readonly>الموافقة على الطلب وإصدار الرد.</textarea></div>
      <div><label>المعتمِد / التوجيه</label><input value="يعتمد — للإفادة" readonly></div>
    </div>
    <div class="actions">
      <button class="btn" type="button">حفظ ورقة العرض</button>
      <button class="btn3" type="button">تسجيل التوجيه</button>
      <button class="btn2" type="button">طباعة ورقة العرض</button>
      <button class="btn2" type="button">تصدير ورد</button>
    </div>
  </div>
</body>
</html>
