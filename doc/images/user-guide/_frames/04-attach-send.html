<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-steps</title>
<style>
@font-face{font-family:'GretaArabic';src:url('GretaArabic-Regular.otf') format('opentype');font-weight:400}
@font-face{font-family:'GretaArabic';src:url('GretaArabic-Bold.otf') format('opentype');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;font-family:'GretaArabic',Arial,sans-serif;background:#f8f6f2;color:#3B4F6E}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;
background-image:radial-gradient(ellipse at 15% 10%,rgba(249,241,235,.95),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(59,79,110,.08),transparent 50%)}
.h{font-size:26px;font-weight:700}
.row{display:flex;align-items:center;gap:18px}
.card{width:260px;background:#fff;border:1px solid #e6e2da;border-top:4px solid #3B4F6E;border-radius:16px;padding:28px 20px;text-align:center;box-shadow:0 8px 24px rgba(59,79,110,.07)}
.num{width:42px;height:42px;border-radius:50%;background:#3B4F6E;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 14px;font-size:18px}
.t{font-size:22px;font-weight:700;margin-bottom:8px}
.d{font-size:14px;color:#6b7280}
.arrow{font-size:34px;font-weight:700;color:#3B4F6E}
</style>
</head>
<body>
  <div class="h">بعد حفظ المعاملة</div>
  <div class="row">
    <div class="card"><div class="num">1</div><div class="t">إرفاق</div><div class="d">PDF أو صورة</div></div>
    <div class="arrow">←</div>
    <div class="card"><div class="num">2</div><div class="t">إرسال</div><div class="d">بريد أو واتساب</div></div>
    <div class="arrow">←</div>
    <div class="card"><div class="num">3</div><div class="t">طباعة</div><div class="d">ورقة المعاملة</div></div>
  </div>
</body>
</html>
