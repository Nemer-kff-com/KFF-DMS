<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>frame-incoming</title>
<style>
@font-face{font-family:'GretaArabic';src:url('GretaArabic-Regular.otf') format('opentype');font-weight:400}
@font-face{font-family:'GretaArabic';src:url('GretaArabic-Bold.otf') format('opentype');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;font-family:'GretaArabic',Arial,sans-serif;background:#f8f6f2;color:#3B4F6E}
body{display:flex;align-items:center;justify-content:center;
background-image:radial-gradient(ellipse at 15% 10%,rgba(249,241,235,.95),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(59,79,110,.08),transparent 50%)}
.card{width:820px;background:#fff;border:1px solid #e6e2da;border-top:4px solid #3B4F6E;border-radius:16px;padding:28px;box-shadow:0 12px 40px rgba(59,79,110,.12)}
.h{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#6b7280;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.hint{font-size:12px;color:#6b7280;margin-top:4px}
input{width:100%;border:1px solid #e6e2da;border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;color:#3B4F6E}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:8px;background:#3B4F6E;color:#fff;font:inherit;font-weight:700;padding:11px 18px}
.btn2{border:1px solid #e6e2da;border-radius:8px;background:#fff;color:#3B4F6E;font:inherit;font-weight:700;padding:11px 18px}
</style>
</head>
<body>
  <div class="card">
    <div class="h">وارد جديد</div>
    <div class="sub">مؤسسة الملك فيصل الخيرية — نظام الصادر والوارد</div>
    <div class="row">
      <div><label>الموضوع</label><input value="خطاب وارد" readonly></div>
      <div><label>تاريخ الاستلام</label><input value="2026-09-08" readonly></div>
    </div>
    <div class="row">
      <div><label>الجهة المرسلة</label><input value="جهة المراسلة" readonly></div>
      <div>
        <label>رقم خطاب الجهة</label>
        <input value="١٢٣٤ / ١٤٤٧" readonly>
        <div class="hint">رقم الخطاب كما هو مكتوب عند الجهة المرسلة</div>
      </div>
    </div>
    <div class="row">
      <div>
        <label>ربط بصادر</label>
        <input value="ص/2026/000120 — طلب تعاون" readonly>
        <div class="hint">اختياري: ربط بصادر مسجّل في النظام</div>
      </div>
      <div><label>موعد الرد</label><input value="2026-09-20" readonly></div>
    </div>
    <div class="actions">
      <button class="btn" type="button">حفظ</button>
      <button class="btn2" type="button">إحالة</button>
      <button class="btn2" type="button">طباعة</button>
      <button class="btn2" type="button">إغلاق</button>
    </div>
  </div>
</body>
</html>
